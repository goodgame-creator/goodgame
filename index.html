<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web Cá Nhân</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
            border: 1px solid #334155;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            font-size: 36px;
            font-weight: bold;
            color: white;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #f1f5f9;
        }

        p {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        #result {
            margin-top: 20px;
            font-weight: 600;
            color: #38bdf8;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="avatar">GH</div>
        <h1>Xin chào!</h1>
        <p>Website này được khởi tạo và chạy thành công trên nền tảng GitHub Pages.</p>
        <button class="btn" onclick="sayHello()">Kích hoạt tính năng</button>
        <div id="result"></div>
    </div>

    <script>
        function sayHello() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerText = '✨ Chúc mừng bạn đã thiết lập thành công file index.html!';
        }
    </script>

</body>
</html>
